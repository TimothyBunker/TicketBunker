[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketbunker"
version = "0.6.1"
description = "An intermediate context layer between agile trackers and git"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tb = "ticketbunker.cli:main"

[tool.setuptools.packages.find]
include = ["ticketbunker*"]

[tool.setuptools.package-data]
ticketbunker = [
  "harness/pi/*.ts",
  "runtime/*.json",
  "licenses/*.txt",
  "app_assets/*",
  "app_assets/**/*",
]
