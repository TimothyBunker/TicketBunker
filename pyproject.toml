[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketbunker"
version = "0.1.1"
description = "An intermediate context layer between agile trackers and git"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tb = "ticketbunker.cli:main"

[tool.setuptools.packages.find]
include = ["ticketbunker*"]
