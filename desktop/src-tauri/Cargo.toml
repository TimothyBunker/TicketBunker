[package]
name = "ticketbunker-desktop"
version = "0.2.21"
description = "The TicketBunker desktop application shell"
authors = ["TicketBunker contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ticketbunker_desktop_lib"
