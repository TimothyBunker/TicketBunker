name: Release

on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Build all six platforms (adds Linux arm64, macOS Intel, Windows arm64; macOS is billed at 10x)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The default release is the three platforms people install today: Linux
  # x64, macOS Apple Silicon, Windows x64. The other three are one manual
  # input away, because each macOS job costs ten Linux minutes per minute.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        env:
          ALL: ${{ inputs.all_platforms }}
        run: |
          core='[
            {"os":"ubuntu-latest","platform":"linux-x64","executable":"dist/tb","bundles":"deb,appimage"},
            {"os":"macos-15","platform":"darwin-arm64","executable":"dist/tb","bundles":"app,dmg"},
            {"os":"windows-latest","platform":"windows-x64","executable":"dist/tb.exe","bundles":"nsis"}'
          extra=',
            {"os":"ubuntu-24.04-arm","platform":"linux-arm64","executable":"dist/tb","bundles":"deb"},
            {"os":"macos-15-intel","platform":"darwin-x64","executable":"dist/tb","bundles":"app,dmg"},
            {"os":"windows-11-arm","platform":"windows-arm64","executable":"dist/tb.exe","bundles":"nsis"}'
          if [ "$ALL" = "true" ]; then matrix="${core}${extra}]"; else matrix="${core}]"; fi
          echo "matrix=$(echo "$matrix" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  bundle:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install desktop build tools
        run: npm ci --prefix desktop
      - name: Build and test shared application UI
        run: |
          npm run build --prefix desktop
          npm run test --prefix desktop
      - name: Test core
        run: python -m unittest discover -s tests -v
      - name: Test desktop host
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build standalone tb
        run: |
          python -m pip install "pyinstaller==6.15.0"
          pyinstaller --clean --noconfirm tools/ticketbunker.spec
      - name: Prepare Windows product signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $isRelease = "$env:GITHUB_REF".StartsWith("refs/tags/v")
          # A pre-release tag (v0.6.0-rc1, v0.6.0-beta.2) may ship unsigned so a
          # team can test a build before it owns a certificate; a stable tag may not.
          $isPrerelease = $isRelease -and ("$env:GITHUB_REF_NAME" -match "-")
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            if ($isRelease -and -not $isPrerelease) {
              throw "Stable Windows releases require WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD repository secrets. Tag a pre-release (v0.6.0-rc1) to publish unsigned test builds."
            }
            Write-Warning "Building an unsigned artifact. Only pre-release tags and workflow dispatches use this path."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "ticketbunker-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "The Windows signing certificate could not be imported." }
          $windowsConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path desktop/src-tauri/tauri.windows.conf.json -Value $windowsConfig -Encoding utf8
          $signArchitecture = if ("${{ matrix.platform }}" -eq "windows-arm64") { "arm64" } else { "x64" }
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\$signArchitecture\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "Windows signtool.exe was not found for $signArchitecture." }
          & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/tb.exe
          if ($LASTEXITCODE -ne 0) { throw "The frozen TicketBunker core could not be signed." }
          "WINDOWS_SIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build native desktop app
        run: python tools/build_desktop.py --platform "${{ matrix.platform }}" --tb "${{ matrix.executable }}" --bundles "${{ matrix.bundles }}"
      - name: Verify Windows product signatures
        if: runner.os == 'Windows' && env.WINDOWS_SIGNED_BUILD == 'true'
        shell: pwsh
        run: |
          $executables = @((Get-Item dist/tb.exe)) + @(Get-ChildItem dist/releases -Filter *.exe)
          if ($executables.Count -lt 2) { throw "The signed core or Windows installer is missing." }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($executable.Name): $($signature.Status)"
            }
          }
      - name: Build verified bundle
        run: python tools/build_release.py --platform "${{ matrix.platform }}" --tb "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ticketbunker-${{ matrix.platform }}
          path: dist/releases/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" release-assets/* "${flags[@]}"
